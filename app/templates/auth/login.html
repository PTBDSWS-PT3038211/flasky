{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}Flasky - Entrar{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Entrar</h1>
</div>
<div class="col-md-4">
    {{ wtf.quick_form(form) }}
    <br>
    <p>Esqueceu sua senha? <a href="{{ url_for('auth.password_reset_request') }}">Clique aqui para redefini-la</a>.</p>
    <p>Novo usuário? <a href="{{ url_for('auth.register') }}">Clique aqui para se cadastrar</a>.</p>
</div>
{% endblock %}
